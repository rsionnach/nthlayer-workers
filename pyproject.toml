[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nthlayer-workers"
version = "2.0.0"
description = "NthLayer workers — Tier 2 background computation (observe, measure, correlate, respond, learn)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # >=3.0.0, NOT >=2.1.2. 3.0.0 moves SLO target conversion to the INBOUND
    # manifest boundary (opensrm-ocvu), so a v2 objective target of 0.999 now
    # parses to 99.9 where it used to parse to 0.999. The measure adapter
    # compares SLODefinition.target against a measured value directly, so 2.x
    # and 3.x differ by 100x on the v2 path — the floor must admit neither
    # convention but the one this code is written against. 3.0.0 also makes
    # iter_manifest_files return one manifest per stem (opensrm-xvwt), which
    # retires this package's own same-stem duplicate handling; the remaining
    # service-name duplicate branch in learn/retrospective.py is still live and
    # is covered by TestDuplicateServiceAcrossDifferentStems.
    # Full list: nthlayer-common/docs/upgrading-3.0.md.
    #
    # The historical 2.1.2 floor was about foreign_yaml_reason's inert
    # body-recovery step, inherited and still satisfied.
    #
    # CI resolves nthlayer-common from a sibling checkout, so it would not
    # notice a bad resolve. tests/observe/test_slo_spec_loader.py's
    # TestSharedGateResolvesCorrectly exists for that: it uses the shapes the
    # PARSERS produce and fails against 2.1.0. NOTE: unlike the other four
    # siblings, this package has no test_dependency_declarations.py and no
    # EXPECTED_MAJORS guard, so nothing here fails when this range drifts from
    # the version under test — only .claude/bin/eco-doctor.sh catches it.
    "nthlayer-common>=3.0.0,<4.0.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "structlog>=24.1.0",
    "scipy>=1.11",
    "numpy>=1.24",
    "starlette>=0.40",
    "uvicorn>=0.30",
    # Required by ApprovalServer's Slack interaction endpoint at
    # `respond/server.py:197` — `await request.form()` hard-imports
    # python-multipart via Starlette. Operators running with
    # `slack_signing_secret` set need this at runtime, not just for
    # tests; declared as a top-level production dep.
    "python-multipart>=0.0.18",
    "ruamel.yaml>=0.18",
    "textual>=1.0",
]

[project.scripts]
nthlayer-workers = "nthlayer_workers.cli:main"
nthlayer-learn = "nthlayer_workers.learn.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.uv.sources]
nthlayer-common = { path = "../nthlayer-common", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Ruff configuration (opensrm-d96q floor). Explicit defaults so future
# violations show up as new findings rather than blending in. Tightening
# beyond E/F (isort/pyupgrade/simplify/bugbear) is tracked in
# opensrm-d96q.1 .. d96q.4 — each rule family is its own bead because
# the cumulative diff across all four is ~640 findings.
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Mirrors ruff's literal default select (E4/E7/E9 + F) plus I (isort,
# opensrm-ncy0), UP (pyupgrade, opensrm-6nn1), SIM (simplify,
# opensrm-y7dd), and B (bugbear, opensrm-po23). E501 / W are separate
# hygiene calls (line-too-long has 393 hits today).
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "B"]

[tool.ruff.lint.per-file-ignores]
# Correlate test files defer some imports until after pytest.importorskip
# / pytestmark blocks (the modules under test optional-import heavy deps).
# Pin E402 here instead of scattering noqa: E402 across the call sites.
"tests/correlate/test_*.py" = ["E402"]
