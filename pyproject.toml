[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nthlayer-workers"
version = "1.0.0"
description = "NthLayer workers — Tier 2 background computation (observe, measure, correlate, respond, learn)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nthlayer-common>=0.1.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "structlog>=24.1.0",
    "scipy>=1.11",
    "numpy>=1.24",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
nthlayer-workers = "nthlayer_workers.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.uv.sources]
nthlayer-common = { path = "../nthlayer-common", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
